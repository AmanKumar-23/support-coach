<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not allowed — Support Coach</title>
<style>
:root{
  --bg:#F5F4F1; --surface:#FFFFFF; --surface-3:#F2F1ED;
  --ink:#16181C; --ink-2:#5A6069; --ink-3:#8B929B;
  --line:#EAE8E3; --line-2:#E0DDD6;
  --brand:#EF4E2B; --amber-bg:#FDF2E0;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sh-2:0 1px 3px rgba(16,24,40,.06), 0 8px 24px -6px rgba(16,24,40,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
  display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:440px;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-2);
  padding:34px 32px 28px;text-align:center}
.ico{width:58px;height:58px;border-radius:18px;background:var(--amber-bg);
  display:grid;place-items:center;font-size:26px;margin:0 auto 18px}
h1{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
p{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.who{margin-top:18px;padding:11px 14px;border-radius:12px;
  background:var(--surface-3);border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2)}
.who b{font-family:var(--mono);font-weight:700;color:var(--ink)}
.row{display:flex;gap:10px;margin-top:22px}
a.btn{flex:1;height:40px;display:grid;place-items:center;border-radius:11px;
  text-decoration:none;font-size:13px;font-weight:700;transition:.15s;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
a.btn:hover{background:var(--surface-3);color:var(--ink)}
a.btn.primary{border:0;color:#fff;
  background:linear-gradient(160deg,#FF6B3D,var(--brand));
  box-shadow:0 3px 12px rgba(239,78,43,.3)}
a.btn.primary:hover{filter:brightness(1.05)}
</style>
</head>
<body>

<div class="card">
  <div class="ico">🔒</div>
  <h1>You cannot open that</h1>
  <p>
    Your account is signed in, but this page needs a role yours does not have.
    If you think it should, ask an administrator to change your role.
  </p>
  <div class="who" id="who" hidden>
    Signed in as <b id="whoName">—</b> · role <b id="whoRole">—</b>
  </div>
  <div class="row">
    <a class="btn primary" href="/">Back to the console</a>
    <a class="btn" href="#" id="out">Sign out</a>
  </div>
</div>

<script>
fetch("/api/me").then(r => r.json()).then(d => {
  if(!d.ok) return;
  document.getElementById("whoName").textContent = d.user.username;
  document.getElementById("whoRole").textContent = d.user.role;
  document.getElementById("who").hidden = false;
}).catch(() => {});

document.getElementById("out").onclick = async e => {
  e.preventDefault();
  await fetch("/api/logout", {method: "POST"}).catch(() => {});
  location.href = "/login";
};
</script>
</body>
</html>

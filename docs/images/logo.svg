<svg xmlns="http://www.w3.org/2000/svg" width="560" height="140" viewBox="0 0 560 140" role="img" aria-label="Support Coach">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B3D"/>
      <stop offset="1" stop-color="#D8401F"/>
    </linearGradient>
  </defs>

  <!-- Mark: a speech bubble with a rising signal inside it. -->

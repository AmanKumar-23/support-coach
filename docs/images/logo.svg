  <rect x="38" y="76"  width="12" height="20" rx="4" fill="#fff" opacity=".95"/>
  <rect x="56" y="62"  width="12" height="34" rx="4" fill="#fff" opacity=".95"/>
  <rect x="74" y="42"  width="12" height="54" rx="4" fill="#fff"/>

  <text x="140" y="70" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif"
        font-size="44" font-weight="700" fill="#16130F">Support Coach</text>
  <text x="142" y="102" font-family="'SF Mono',Menlo,Consolas,monospace"
